name: Build aRDP Pro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Prepare aRDP project & prebuilt libraries
        run: |
          chmod +x ./download-prebuilt-dependencies.sh
          chmod +x ./bVNC/prepare_project.sh
          
          # Baixa dependências C/C++ pré-compiladas
          ./download-prebuilt-dependencies.sh
          
          # Garante inclusão dos módulos no settings.gradle
          if ! grep -q "aRDP-app" settings.gradle; then
            echo "include ':aRDP'" >> settings.gradle
            echo "include ':aRDP-app'" >> settings.gradle
          fi

          # Harmoniza a JVM entre Kotlin e Java e desativa checagem estrita
          echo "org.gradle.java.home=$JAVA_HOME" >> gradle.properties
          echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties

          # Prepara o projeto para aRDP
          ./bVNC/prepare_project.sh --skip-build aRDP "$ANDROID_HOME"

      - name: Build aRDP Pro APK (Debug)
        run: |
          chmod +x ./gradlew
          ./gradlew :aRDP-app:assembleDebug -Pkotlin.jvm.target.validation.mode=warning --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aRDP-Pro-Debug-APK
          path: aRDP-app/build/outputs/apk/debug/*.apk
