name: Build aRDP Pro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Prepare aRDP project & prebuilt libraries
        run: |
          chmod +x ./download-prebuilt-dependencies.sh
          chmod +x ./bVNC/prepare_project.sh
          
          # 1. Baixa dependencias pre-compiladas
          ./download-prebuilt-dependencies.sh
          
          # 2. Aplica os patches oficiais do FreeRDP fornecidos pelo autor
          pushd remoteClientLib/jni/libs/deps/FreeRDP/
          for p in ../../*_freerdp_*.patch; do
            patch -N -p1 < "$p" || true
          done
          popd

          # 3. Garante inclusao dos modulos no settings.gradle
          if ! grep -q "aRDP-app" settings.gradle; then
            echo "include ':aRDP'" >> settings.gradle
            echo "include ':aRDP-app'" >> settings.gradle
          fi

          # 4. Fixa o Gradle no JDK 21
          echo "org.gradle.java.home=$JAVA_HOME" >> gradle.properties

          # 5. Prepara o projeto para aRDP
          ./bVNC/prepare_project.sh --skip-build aRDP "$ANDROID_HOME"

      - name: Build aRDP Pro APK (Debug)
        run: |
          chmod +x ./gradlew
          ./gradlew :aRDP-app:assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aRDP-Pro-Debug-APK
          path: aRDP-app/build/outputs/apk/debug/*.apk
